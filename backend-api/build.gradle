plugins {
    id 'org.springframework.boot' version "3.5.6"
    id 'com.palantir.docker' version '0.35.0'
    id 'java'
}

ext{
    set("springBootVersion", "3.5.6")
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-web:$springBootVersion")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion")
    implementation "org.springframework.boot:spring-boot-starter-security:$springBootVersion"
    implementation("org.springframework.boot:spring-boot-starter-validation:$springBootVersion")

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation("org.liquibase:liquibase-core:4.27.0")
    implementation("com.h2database:h2:2.3.232")
    implementation("org.postgresql:postgresql:42.7.4")
    //implementation('org.hibernate:hibernate-core:6.5.0.Final')


}

jar{
    enabled = false
}

bootJar {
    enabled = true
    archiveBaseName = 'backend-api'
    archiveVersion = '1.0.0'
}

docker {
    name "backend-api:1.0.0"
    files 'build/libs/backend-api-1.0.0.jar'
    buildArgs(['JAR_FILE': "backend-api-1.0.0.jar"])
}
