<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Авторизация | Планировщик задач</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<h1>Добро пожаловать!</h1>
<div id="auth-area">
    <form id="login-form">
        <h2>Вход</h2>
        <input name="username" placeholder="Логин или email" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
        <p class="msg small" id="login-msg"></p>
    </form>

    <form id="register-form">
        <h2>Регистрация</h2>
        <input name="username" placeholder="Логин или email" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Зарегистрироваться</button>
        <p class="msg small" id="register-msg"></p>
    </form>
</div>

<div id="user-info" style="display:none;">
    <p>Вы вошли как: <span id="username"></span></p>
    <button id="logout-btn">Выйти</button>
</div>

<script src="app.js"></script>
</body>
</html>
